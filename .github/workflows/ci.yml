name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/lib/config.dart
          example/lib/delegate/demo_wallet_delegate.dart
          example/lib/wallet/demo_wallet.dart example/test

      - name: Analyze SDK
        run: dart analyze

      - name: Test SDK
        run: flutter test --coverage

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Validate package
        run: dart pub publish --dry-run

  web-demo:
    name: Web demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/dapp-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/dapp-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build
